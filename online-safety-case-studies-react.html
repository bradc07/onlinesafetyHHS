ite:m,childSprite:f,background:u,bubbles:["They seem unsettled tonight...","I saw something scary..."],situation:"Your 7-year-old has been watching videos on YouTube Kids. At bedtime, they seem unsettled and eventually tell you that they saw something that scared them - a video that \"looked normal at first\" but then had something frightening in it. They're now saying they don't want to use the tablet anymore and seem anxious. They also admit they didn't tell you straight away because they thought they might get in trouble.",options:[{letter:"A",text:"Remove tablet access for now until they feel ready, and let the anxiety settle naturally."},{letter:"B",text:"Sit with them and try to find the video so you can understand what they saw and report it."},{letter:"C",text:"Reassure them they're not in trouble, talk about what they saw, and adjust the settings together."},{letter:"D",text:"Keep things normal - don't make a big deal of it, as you don't want to increase their anxiety by focusing on it."}],thinking:[{letter:"A",text:"This protects them in the short term and removes the source of anxiety. However, avoidance can sometimes reinforce fear rather than resolve it. If they eventually return to the tablet without any conversation or changes, they may feel just as vulnerable."},{letter:"B",text:"This shows you're taking it seriously, and reporting harmful content is genuinely helpful. But asking a child to revisit something frightening can be distressing, and you may not find it anyway. If you do search, do it privately rather than with them."},{letter:"C",text:"This addresses several things at once: it makes clear they won't be punished for telling you (which encourages future honesty), it opens a conversation about what upset them, and it gives them some agency by involving them in making things safer. This is generally the approach child psychologists recommend."},{letter:"D",text:"This has good intentions - not amplifying anxiety is wise. But children often interpret adult silence as confirmation that something is too bad to discuss, which can increase worry rather than reduce it."}],expert:"Start with reassurance and warmth. Thank them for telling you. Let them share as much or as little as they want without pressing for details. Later, review your settings privately, and consider whether YouTube Kids is still the right platform or whether something more locked-down might help for now. Keep the door open for future conversations.",reflection:"Does your child know they can always tell you about anything that worries them online - even if they think they might have done something wrong?"},{id:2,title:'"Everyone Else Has It"',subtitle:"Social pressure for apps and platforms",icon:"📱",iconColor:"bg-gradient-to-br from-sky to-blue-400",parentSprite:p,childSprite:d,background:u,bubbles:["All my friends are on it!","The age limit is 13..."],situation:"Your 8-year-old comes home insisting that \"literally everyone\" in their class is on TikTok and that they're being left out of conversations. They're upset and say they feel like the only one who isn't allowed. You know TikTok's age rating is 13+, but you also don't want your child to feel socially isolated. A few parents you know have let their children have accounts.",options:[{letter:"A",text:"Hold the line - the age rating exists for a reason, and you'll explain why they need to wait."},{letter:"B",text:"Let them have an account but with strict supervision, time limits, and privacy settings."},{letter:"C",text:"Suggest alternatives - perhaps they could watch some TikTok videos with you, or use a different app that's more age-appropriate."},{letter:"D",text:'Talk to other parents to understand what\'s actually happening and whether "everyone" really does have it.'}],thinking:[{letter:"A",text:"This is the clearest boundary and aligns with the platform's own rules. Age ratings aren't arbitrary - TikTok's algorithm, content, and messaging features aren't designed for young children. The challenge is that simply saying \"no\" without conversation can feel dismissive to a child who's experiencing genuine social pressure."},{letter:"B",text:"This is what many parents do in practice. Supervision helps, but it's worth knowing that even with the best settings, content can slip through, and children often find ways around restrictions. You'd also be teaching that age limits are negotiable, which may complicate future boundaries."},{letter:"C",text:"This offers a middle ground. Watching together occasionally lets them understand references without having their own account. Other platforms might feel like a compromise, though none are perfect for this age group."},{letter:"D",text:'This is useful because children\'s perception of "everyone" is often inaccurate. Talking to parents at pick-up or in class groups might reveal that fewer children have accounts than your child believes - or might confirm it, which is useful information too.'}],expert:'The age limit matters, and the evidence supports waiting. But how you hold that boundary matters just as much. Acknowledge their feelings, be honest about your reasons, and help them find language for explaining to friends if needed ("My parents are really strict about apps" is socially easier than they might think). Revisit the conversation periodically so they know it\'s not a permanent "no" but an age-appropriate "not yet."',reflection:"Do you know what age the apps your child mentions are actually rated for? Have you talked about why those ratings exist?"},{id:3,title:"Unkind Messages",subtitle:"When children are involved in online meanness",icon:"💬",iconColor:"bg-gradient-to-br from-purple-200 to-purple-400",parentSprite:g,childSprite:h,background:u,bubbles:["I found some messages...","Everyone was doing it..."],situation:"You discover that your 7-year-old has been using a messaging feature in a game to chat with classmates. Reading the messages, you find a conversation where several children, including your own, have been saying unkind things about another child in the class. Your child wasn't the instigator, but they joined in and sent a couple of mean messages. The targeted child isn't someone your child is close to.",options:[{letter:"A",text:"Remove the game immediately - they've shown they can't be trusted with messaging features."},{letter:"B",text:"Have a serious conversation about what they did and why it was wrong, but let them keep the game."},{letter:"C",text:"Speak to the other child's parents to let them know what's been happening."},{letter:"D",text:"Contact the school and let them handle it as a behavioural matter."}],thinking:[{letter:"A",text:"This creates an immediate consequence and removes the environment where this happened. However, it doesn't teach your child why what they did was harmful, and the social dynamic that led to the behaviour will still exist at school. They may feel punished without understanding."},{letter:"B",text:"This focuses on the learning opportunity. Children this age are still developing empathy and understanding of how words affect others. A conversation about how the other child might have felt, why it's easier to be unkind in messages than face-to-face, and what they could do differently is valuable. You might also adjust permissions so messaging requires supervision."},{letter:"C",text:"This is considerate but complicated. The other parents might not know, and their child might be struggling. However, this can also escalate situations and create conflict between families. Consider whether the school might be better placed to handle communication."},{letter:"D",text:"This acknowledges that this is a peer behaviour issue that extends beyond your home. Schools often have processes for restorative conversations. However, involving school for a first incident might feel disproportionate to your child, and you'd lose some control over how it's addressed."}],expert:"Treat this as a teaching moment first. Children follow group behaviour, especially online where consequences feel invisible. Have a calm, curious conversation: what made them join in? How do they think the other child felt? What could they do next time? Consider whether any repair is possible - a kind gesture, an apology if appropriate. Review whether messaging features are suitable for their age. If the behaviour continues or was severe, involving school becomes more appropriate.",reflection:"Does your child understand that messages are permanent and can be shown to others? Have you talked about what to do when friends are being unkind and they feel pressure to join in?"},{id:4,title:"In-App Purchases",subtitle:'When "free" games cost real money',icon:"💰",iconColor:"bg-gradient-to-br from-amber-200 to-amber-400",parentSprite:m,childSprite:d,background:u,bubbles:["There's been some purchases...","I didn't know it was real money!"],situation:"Your 6-year-old has been playing a free game on the tablet. You discover that over the past month, several small purchases have been made - £2.99 here, £4.99 there - adding up to over £40. Your child says they didn't realise it was real money; they thought they were just collecting coins in the game. They're upset and worried they're in serious trouble.",options:[{letter:"A",text:"Delete the game and don't allow any games with in-app purchases in future."},{letter:"B",text:"Explain what happened and use it as a lesson about real money versus game currency, then add proper restrictions."},{letter:"C",text:"Contact Apple or Google to request refunds, explaining the purchases were made by a child without understanding."},{letter:"D",text:'Make them "earn back" the money through chores or pocket money, so they understand the consequence.'}],thinking:[{letter:"A",text:'This prevents recurrence but might feel like punishment for something they genuinely didn\'t understand. Many games are deliberately designed to blur the line between "game coins" and real purchases - your child was manipulated by design, not being dishonest.'},{letter:"B",text:'This turns the situation into education. Showing them that the "coins" cost real money, explaining how much £40 actually is (perhaps in terms they understand, like "that\'s eight weeks of pocket money" or "that\'s the cost of a new toy"), and then adding password requirements for purchases addresses the issue constructively.'},{letter:"C",text:"This is worth doing regardless of what else you choose. Both Apple and Google have processes for refunding purchases made by children, especially if you can show the account holder didn't authorise them. This doesn't mean avoiding the conversation with your child, but it does mean you may recover the money."},{letter:"D",text:"This makes the consequence tangible, which some parents find helps children understand. However, at age 6, the connection between chores now and an abstract purchase made weeks ago might be too distant to be meaningful. It could also create shame rather than understanding."}],expert:"Combine understanding with practical action. Reassure your child that they're not in terrible trouble, but help them understand what happened. Request refunds through the app store. Then lock down purchasing immediately - both Apple and Android have settings to require passwords or disable in-app purchases entirely for children's accounts. Consider this a prompt to review all the games they play for similar mechanics.",reflection:"Are in-app purchases restricted on your child's devices? Do they understand the difference between game currency and real money?"},{id:5,title:"Screen Transitions",subtitle:"When turning off screens triggers meltdowns",icon:"😤",iconColor:"bg-gradient-to-br from-peach to-coral",parentSprite:p,childSprite:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAABICAYAAACjpDbfAAABS0lEQVR4nO2aMQrCMBSGU3F31FUQLyDi5OxSXEQXN3GQnsAjeILiIG4uukkXjyDiBYrgqqMn0LVWSXy0of7h/7aSps3HS3iP13pKyCWaPqVz8qThrzzJ/SVbC/kXKIiOcT8XfeZMmM6k8xGkIDoURIeC6IjqOqWUesaHQvOi1+yxFk1CQXQoiA4F0SlnfUCrH2jHz/vQ6nwTzkeQgujIa9Fo+16LNiu5LeYr8ePt0vNHrEWTUBAdeR4Unrnjeqcd70yGub4vjfMRpCA64jyYxnaPRtqDSeN8BCmIjnh/3zbLQvuitfGMtWgSCqLzsZ9Nee1+utpbzQ9U23XteDpvOh9BCqLDPIgOBdGhIDoURCdzT2Y6D63mxdUiYE9GBwXRoSA6FETH+rcJ07eFrPNNOB9BCqJDQXQoiE7m/0W7A/3/nrbnm3A+ghRE5wXlSTzrSEcOjQAAAABJRU5ErkJggg==",background:u,bubbles:["Time to turn it off now.","Just one more! Please!"],situation:"Your 4-year-old has been watching CBeebies on the tablet while you prepared dinner. When you say it's time to turn it off and come to the table, they refuse. This escalates quickly - they're crying, shouting \"just one more!\", and when you take the tablet, they have a full meltdown. This pattern has been happening more often lately. Whoever is doing pick-up and teatime - whether that's you, your partner, or your nanny - is experiencing the same battles.",options:[{letter:"A",text:"Let them finish the episode to avoid the meltdown, then turn it off - at least the transition is calmer."},{letter:"B",text:"Hold firm, remove the tablet, and accept that the meltdown is part of them learning boundaries."},{letter:"C",text:"Give warnings before screen time ends (\"five more minutes, then it's dinner time\") so the transition isn't sudden."},{letter:"D",text:"Reduce screen time overall so there are fewer transitions to manage, and they're less dependent on it."}],thinking:[{letter:"A",text:'This is tempting because it works in the moment. But children quickly learn that resistance extends screen time, and "just one more" becomes a negotiation tactic. You may also find that the end of the next episode triggers the same reaction - you\'ve just delayed it.'},{letter:"B",text:"This establishes that the boundary is firm, which children do ultimately find reassuring even when they protest. However, without any support for the transition itself, you may be creating repeated distressing experiences for everyone. A 4-year-old's brain genuinely struggles to shift from something engaging, so some compassion for the difficulty is warranted."},{letter:"C",text:'This addresses the real problem: transitions are hard, and sudden ones are hardest. Warnings help children mentally prepare. Some families use visual timers, a "two-minute warning" song, or a consistent phrase. The key is consistency - if warnings are given but not followed through, they lose meaning.'},{letter:"D",text:"This is worth considering as a longer-term adjustment. If screens have become a daily battleground, reducing reliance on them may ease the overall tension. However, this doesn't solve the transition problem itself - you'll still need to manage the moments when screen time does end."}],expert:"Combine a clear, predictable boundary with support for the transition. Warnings genuinely help - give one at five minutes, another at two minutes, and make sure you follow through at zero. Some families find it easier to tie screen time to natural endpoints (\"one episode\" rather than a time limit). Acknowledge their feelings (\"I know it's hard to stop when you're enjoying it\") while holding the boundary. Make what comes next appealing if you can - \"the tablet's going off now, and you're going to help me set the table\" gives them something to move toward, not just something being taken away.\n\nIf multiple caregivers are involved, consistency matters enormously. A child who knows that the boundary shifts depending on who's in charge will test it every time. It's worth having a quick conversation with anyone who regularly cares for your child about how you're handling screen transitions.",reflection:"Does everyone who looks after your child handle screen transitions the same way? Do you give warnings before screen time ends, and do you follow through consistently?"},{id:6,title:"Voice Assistants",subtitle:"When children discover Alexa and Google",icon:"🔊",iconColor:"bg-gradient-to-br from-sky to-blue-400",parentSprite:g,childSprite:f,background:u,bubbles:["Alexa, what happens when you die?","Just ask Alexa!"],situation:"Your 5-year-old has discovered they can talk to Alexa. At first it was charming - asking about dinosaurs, requesting songs, getting jokes. But you've noticed some issues. They've been asking questions you'd rather they didn't (\"Alexa, what happens when you die?\"), they've accidentally triggered purchases, and they seem to expect instant answers to everything now. Your nanny mentioned that when she said she didn't know something, your child replied \"Just ask Alexa.\"",options:[{letter:"A",text:"Remove the smart speaker from shared spaces, or disable it when children are around."},{letter:"B",text:"Keep it but teach your child rules about what kinds of questions are for Alexa and what kinds are for grown-ups."},{letter:"C",text:"Adjust the settings - enable purchase confirmations, set up a kid-friendly mode, and review what content is accessible."},{letter:"D",text:"Use it as a learning opportunity - sit with them and explore questions together, modelling how to evaluate answers."}],thinking:[{letter:"A",text:"This is the cleanest solution but may feel extreme if the device is useful for the household. It also doesn't prepare your child for a world where voice assistants are increasingly common."},{letter:"B",text:"This addresses the behaviour but relies on a 5-year-old remembering and following rules, which is developmentally unreliable. They're not being defiant when they forget - impulse control at this age is genuinely limited."},{letter:"C",text:"This is practical and reduces risk. Most smart speakers have parental controls, kid-specific modes, and purchase protections. However, settings alone don't address the underlying relationship your child is developing with the device."},{letter:"D",text:"This treats the device as a tool to be used thoughtfully rather than a convenient answer machine. Exploring questions together teaches critical thinking: \"Let's see what Alexa says, and then let's think about whether that sounds right.\" This takes more time but builds better habits."}],expert:"Smart speakers aren't inherently problematic, but young children can develop an expectation of instant, effortless answers that doesn't serve them well. Use the parental controls available (voice purchasing off, explicit content filtered), but also invest time in modelling thoughtful use. Help them understand that Alexa doesn't \"know\" things the way people do, and that some questions are better for humans. If the device is becoming a source of conflict or concern, there's no harm in removing it from child-accessible areas for now.",reflection:"What questions has your child been asking your smart speaker? Are there parental controls you haven't yet explored?"},{id:7,title:"Older Siblings' Influence",subtitle:"When younger children want what big kids have",icon:"👫",iconColor:"bg-gradient-to-br from-green-200 to-green-400",parentSprite:m,childSprite:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAABICAYAAACjpDbfAAABTklEQVR4nO2aIQ7CQBBFtwTPLbgAAgMa02AICBQhKE6AQqA4AYoQMISAIzV4DIILcAs0oth2IR0m7ab8zX+uabfdl+lmprMNjJJo2Iq1Y4ok3F8DzfUVVxP5FyiIjvg+l73mJKQ16X0EKYgOBdGhIDqqus4YY+LHpdS8GNQ7rEWTUBAdCqJDQXSqeW/Q6E4zz9/PK6fjJbyPIAXR0dei0TFdi9ZrhU3mK49n6jAIB6xFk1AQHX0eVK652+aUeb457hf6PBvvI0hBdNR50MZ1j0bbg7HxPoIUREf9fm8XUal90dE8ZC2ahILofNSiUl7bHV7uZvMD0vzsvOl9BCmIzscalGq/svMg9wctKIgOBdGhIDq5ezKT2cppXlwvp+zJZEFBdCiIDgXRcb43IX2/5R0v4X0EKYgOBdGhIDq5/xdt97L/93Q9XsL7CFIQnTcRtj95WRXFTgAAAABJRU5ErkJggg==",background:u,bubbles:["I want to play too!","It's not fair, they always get to!"],situation:"Your 5-year-old's older sibling (age 10) plays Roblox and watches YouTube videos that aren't age-appropriate for a Reception child. Your younger child desperately wants to join in and is increasingly upset about being \"left out.\" They've started sneaking into their sibling's room to watch, and there have been arguments. Your older child feels it's unfair that they have to change what they do because of their younger sibling.",options:[{letter:"A",text:"Hold firm on the age difference - the younger child simply isn't old enough, and the older child shouldn't have to compromise."},{letter:"B",text:"Let the younger child participate in some activities with the older sibling, supervised, so they feel included."},{letter:"C",text:"Create clear boundaries about where and when the older child can use screens, so the younger one isn't constantly exposed."},{letter:"D",text:"Find age-appropriate alternatives that feel similar, so the younger child has their own version of what the older one enjoys."}],thinking:[{letter:"A",text:"This is clear but doesn't resolve the emotional difficulty for either child. The younger child's feelings of exclusion are real, and the older child may still end up inadvertently exposing their sibling to content."},{letter:"B",text:"This acknowledges the sibling relationship and the younger child's desire to connect. Some Roblox games are more suitable than others, and watching together with a parent present is different from unsupervised access. However, this requires your time and attention, and the older child may resent the intrusion."},{letter:"C",text:"This is practical: if the older child's screen time happens in their bedroom with the door closed, or after the younger one is in bed, exposure is limited. This protects the younger child but doesn't address their desire to be included."},{letter:"D",text:'This gives the younger child something of their own. There are games and videos designed for their age that might satisfy the desire to be "doing what big kids do" without the inappropriate content. This works best if framed positively rather than as a consolation prize.'}],expert:"Sibling dynamics make this genuinely difficult, and there's no perfect solution. A combination usually works best: protect the younger child from content they're not ready for (through physical and time-based boundaries), while also finding ways for them to feel included in age-appropriate sibling activities. Talk to both children - the older one about responsibility and kindness, the younger one about age-appropriate waiting. Where possible, find things they can enjoy together that work for both ages.",reflection:"How do screens currently work in your home when siblings of different ages are present? Does your older child understand why some content isn't suitable for their younger sibling?"},{id:8,title:"Photos and Digital Footprint",subtitle:"Sharing children's images online",icon:"📸",iconColor:"bg-gradient-to-br from-purple-200 to-purple-400",parentSprite:p,childSprite:h,background:c,bubbles:["Look at this sweet photo!","Will I want this online when I'm older?"],situation:"You've been sharing photos of your children on social media since they were born - first steps, school uniform photos, birthday parties. A friend recently mentioned that their child, now a teenager, is upset about photos their parents posted years ago. You've never really thought about whether your 6-year-old would want these photos online when they're older. You also realise that photos from school events sometimes include other people's children, and you're not sure how other parents feel about that.",options:[{letter:"A",text:"Stop posting photos of your children entirely until they're old enough to consent."},{letter:"B",text:"Continue as you are - these are happy memories, and social media is how families stay connected."},{letter:"C",text:"Review your privacy settings and be more selective about what you share and with whom."},{letter:"D",text:"Start asking your child's opinion before posting, even at this young age."}],thinking:[{letter:"A",text:"This is the most privacy-protective approach, but may feel extreme if sharing photos is how you stay connected with distant family. It also doesn't address photos already posted."},{letter:"B",text:"This reflects how many families use social media, and the intentions are good. However, consent matters, and what feels like a sweet photo to you might feel embarrassing to your child in years to come. School uniform photos with visible school names, location-tagged posts, and images that could be taken out of context all carry some risk."},{letter:"C",text:"This is a practical middle ground. Most platforms allow you to limit who sees your posts. Being more thoughtful about what you share - avoiding anything your child might find embarrassing later, not including location information, avoiding other people's children unless you have permission - reduces risk while maintaining connection."},{letter:"D",text:"This respects your child's developing autonomy. Even a 6-year-old can understand \"I'd like to share this photo with Granny and our friends - is that okay with you?\" This plants the seed that they have a say over their own image."}],expert:'Consider the "front page test" - would you be comfortable if this image appeared somewhere public? Avoid photos that could embarrass your child later (bath time, tantrums, anything they might find humiliating as a teenager). Review your privacy settings and be thoughtful about who can see what. Ask permission before posting photos that include other people\'s children. And start involving your own children in decisions about their image - the habit of asking serves them well as they grow.',reflection:"Have you reviewed your social media privacy settings recently? If your child saw the photos you've shared of them, how might they feel?"},{id:9,title:'Advertising and "Free" Games',subtitle:"When games are designed to manipulate",icon:"🎯",iconColor:"bg-gradient-to-br from-peach to-coral",parentSprite:g,childSprite:d,background:u,bubbles:["I need to watch this to get coins!","Can I have this toy I saw?"],situation:"Your 6-year-old plays \"free\" games on the tablet. You've noticed they're now asking for specific toys they've never seen in shops, begging for in-game items, and recently said \"I need to watch this video to get more coins\" while playing. The games seem designed to frustrate them unless they watch adverts or make purchases. They don't seem to understand that the ads are trying to sell them things.",options:[{letter:"A",text:"Only allow games you've paid for upfront, which typically have fewer ads and manipulative mechanics."},{letter:"B",text:"Explain how advertising works and help them understand that games are designed to make them want things."},{letter:"C",text:"Set up the device so ads are minimised - use a child's profile, enable restrictions, or use an ad blocker."},{letter:"D",text:"Let them learn through experience - they'll eventually understand what's happening."}],thinking:[{letter:"A",text:"This costs money but removes the problem at source. Paid games generally don't need to manipulate children into watching ads or making purchases because they've already made their money. The challenge is that \"free\" is very appealing, and your child may feel they're missing out."},{letter:"B",text:'This is educational but challenging for young children. They can begin to understand that "ads are when someone wants you to buy something," but the sophisticated manipulation in many games is designed to work even on adults who understand it. Awareness helps but doesn\'t fully protect them.'},{letter:"C",text:"This uses technical solutions to reduce exposure. Most devices have settings to limit ad tracking, and child profiles often reduce advertising. This helps but isn't foolproof - the mechanics within games (wait timers, artificial scarcity, reward loops) are harder to block."},{letter:"D",text:"This assumes children will naturally become savvy, but the asymmetry is significant: these games are designed by teams of psychologists and data scientists specifically to be compelling. Waiting for a 6-year-old to outsmart that isn't realistic."}],expert:'Young children cannot meaningfully consent to advertising because they don\'t understand its intent. Reduce exposure through a combination of technical settings and curated game choices. When ads do appear, use them as teaching moments: "See how that\'s trying to make you want something? That\'s called an advert." Be especially wary of "free to play" games with wait timers, limited lives, or "watch to earn" mechanics - these are specifically designed to create frustration that spending money resolves.',reflection:"Have you played the games your child plays? Do you know what the monetisation model is and how it tries to get players to spend money or watch ads?"},{id:10,title:"Sleep and Screens",subtitle:"When bedtime becomes a battle",icon:"🌙",iconColor:"bg-gradient-to-br from-sky to-blue-400",parentSprite:m,childSprite:f,background:u,bubbles:["Just one more episode...","They seem so wired tonight."],situation:"Bedtime has become a battle. Your 5-year-old wants to watch \"just one more\" video before bed, and even after screens are off, they seem wired and struggle to settle. They've started waking earlier and asking for the tablet first thing. You've read that screens before bed affect sleep, but the evening routine has become dependent on that quiet screen time while you get their sibling sorted.",options:[{letter:"A",text:'Implement a strict "no screens for an hour before bed" rule, accepting that it will be difficult at first.'},{letter:"B",text:"Switch to less stimulating content before bed - calm music, audiobooks, or gentle programmes rather than exciting games or videos."},{letter:"C",text:"Keep the current routine but adjust the content and brightness - night mode, quieter shows, shorter duration."},{letter:"D",text:"Address the underlying issue: find other ways to occupy them during the busy evening period that don't involve screens."}],thinking:[{letter:"A",text:"This aligns with sleep research, which consistently shows that screens before bed affect both how quickly children fall asleep and the quality of their sleep. The blue light is part of it, but the stimulation matters more. The challenge is that changing an established routine creates conflict, and you need a realistic alternative."},{letter:"B",text:"This is a gentler transition. An audiobook or calm music still provides something to focus on but doesn't have the visual stimulation. Some children find this easier to wind down from. It may also free you from choosing content, as a familiar story can run without intervention."},{letter:"C",text:'This tries to mitigate harm while keeping the convenience. Night mode and calmer content are better than bright screens and exciting games, but "better" isn\'t the same as "good." If sleep problems persist, this may not be enough.'},{letter:"D",text:'This tackles the root cause. If screens at bedtime exist because you need your child occupied, finding an alternative (audiobooks, quiet play, a specific "wind-down box" of calm activities) addresses both the practical need and the sleep issue. This requires some upfront effort to establish.'}],expert:"The evidence is clear that screens before bed impair sleep in young children. Ideally, screens would stop at least an hour before sleep, with the time filled by calmer activities: bath, stories, quiet play. If this feels impossible given your household's realities, work toward it gradually - shifting screen time earlier, introducing audiobooks, making the wind-down routine predictable. The early morning screen request is worth addressing too: if the tablet is the first thing they think about, it suggests a level of dependency worth gently reducing.",reflection:"What does your child's last hour before bed currently look like? Is there screen time you're using for convenience that could be replaced with something that helps them wind down?"},{id:11,title:"Positive Screen Time",subtitle:"Finding the right balance",icon:"✨",iconColor:"bg-gradient-to-br from-green-200 to-green-400",parentSprite:g,childSprite:h,background:c,bubbles:["We learned so much together!","Is this too much screen time?"],situation:'You feel guilty about how much screen time your children have, but you\'re also aware that some of it is genuinely valuable. Your 6-year-old has learned a lot from educational apps, loves nature documentaries, and enjoys playing games together as a family. But you\'re not sure where the line is between "good" screen time and "too much" screen time, and other parents seem to have strong opinions either way.',options:[{letter:"A",text:"Stop worrying about the total amount and focus on what they're watching and whether you're involved."},{letter:"B",text:"Set a clear daily limit regardless of content - structure matters, and even good content needs boundaries."},{letter:"C",text:'Distinguish between "educational" and "entertainment" screen time, and limit only the entertainment.'},{letter:"D",text:"Follow your instincts - you know your child, and if they seem fine, they probably are."}],thinking:[{letter:"A",text:"This reflects current research, which suggests that the quality of screen time and the context around it matter more than raw minutes. A child watching a documentary with a parent who's asking questions and discussing what they see is having a very different experience from a child passively watching videos alone."},{letter:"B",text:"This provides structure, which children benefit from. Even if content is high-quality, unlimited access can still crowd out other valuable activities - physical play, imaginative play, reading, boredom (which has its own developmental value). A limit creates space for balance."},{letter:"C",text:'This tries to categorise screen time, but the line between educational and entertainment is blurry. Many "educational" apps are highly addictive; some games teach problem-solving and persistence. The label matters less than what\'s actually happening.'},{letter:"D",text:'This trusts parental judgment, which is valuable - you do know your child. But guilt often signals something worth examining, and "they seem fine" can miss subtler impacts on sleep, attention, or mood that accumulate gradually.'}],expert:"Move away from guilt and toward intentionality. The goal isn't to eliminate screens but to use them thoughtfully. Ask: Is this content appropriate? Am I involved, or are they alone? Are they learning anything, or just consuming? Is this replacing other important activities? Is it affecting their mood, sleep, or behaviour? Shared screen time - watching together, playing together, discussing what you've seen - is qualitatively different from handing over a device for passive consumption. Both have a place, but the balance matters.",reflection:'When your child has screen time, are you usually present and engaged, or are they alone? What would "positive screen time" look like in your household?'}];var i=a("3KIH9");let y=e=>{let t=e.replace(/^([A-Z])|[\s-_]+(\w)/g,(e,t,n)=>n?n.toUpperCase():t.toLowerCase());return t.charAt(0).toUpperCase()+t.slice(1)},v=(...e)=>e.filter((e,t,n)=>!!e&&""!==e.trim()&&n.indexOf(e)===t).join(" ").trim();var i=a("3KIH9"),b={xmlns:"http://www.w3.org/2000/svg",width:24,height:24,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};let w=(0,i.forwardRef)(({color:e="currentColor",size:t=24,strokeWidth:n=2,absoluteStrokeWidth:r,className:a="",children:l,iconNode:o,...s},u)=>(0,i.createElement)("svg",{ref:u,...b,width:t,height:t,stroke:e,strokeWidth:r?24*Number(n)/Number(t):n,className:v("lucide",a),...!l&&!(e=>{for(let t in e)if(t.startsWith("aria-")||"role"===t||"title"===t)return!0})(s)&&{"aria-hidden":"true"},...s},[...o.map(([e,t])=>(0,i.createElement)(e,t)),...Array.isArray(l)?l:[l]])),k=(e,t)=>{let n=(0,i.forwardRef)(({className:n,...r},a)=>(0,i.createElement)(w,{ref:a,iconNode:t,className:v(`lucide-${y(e).replace(/([a-z0-9])([A-Z])/g,"$1-$2").toLowerCase()}`,`lucide-${e}`,n),...r}));return n.displayName=y(e),n},x=k("chevron-left",[["path",{d:"m15 18-6-6 6-6",key:"1wnfg3"}]]),S=k("chevron-right",[["path",{d:"m9 18 6-6-6-6",key:"mthhwq"}]]),E="#FDF8F3",C="#
